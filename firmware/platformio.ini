; Smart Sort UI
;   pio run -e sim -t exec     -> desktop simulator (needs SDL2: `brew install sdl2`)
;   pio run -e esp32s3 -t upload -> the Waveshare board
[platformio]
default_envs = sim

[common]
lib_deps = lvgl/lvgl@~9.2.2
; LVGL is configured entirely through build flags, so no lv_conf.h file is needed.
build_flags =
    -D LV_CONF_SKIP=1
    -D LV_KCONFIG_IGNORE=1
    -D LV_COLOR_DEPTH=16
    -D LV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_FONT_MONTSERRAT_48=1
    -D LV_USE_LOG=1
    -D LV_LOG_LEVEL=2
    -D LV_LOG_PRINTF=1

[env:sim]
platform = native
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -std=c++17
    -D LV_USE_SDL=1
extra_scripts = pre:sdl_flags.py
build_src_filter =
    +<app/demo_flow.cpp>
    +<app/main_sim.cpp>
    +<ui/ui.cpp>

[env:test_native]
platform = native
lib_deps = ${common.lib_deps}
test_framework = unity
test_build_src = yes
build_flags =
    ${common.build_flags}
    -std=c++17
build_src_filter =
    +<ui/ui.cpp>
test_filter = test_ui

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9
monitor_speed = 115200
; The Waveshare board uses a 16 MB flash and an 8 MB OPI PSRAM ESP32-S3R8 module.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${common.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<app/demo_flow.cpp>
    +<app/main_esp32.cpp>
    +<board/waveshare_touch_lcd_35.cpp>
    +<ui/ui.cpp>
    +<sensors/proximity.cpp>
